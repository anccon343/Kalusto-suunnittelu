# pnpm settings for this single-package repo.

# Run package.json scripts through pnpm's cross-platform shell, so `TZ=... vitest run`
# in test:tz and check also works on Windows.
shellEmulator: true

# Supply-chain guard: refuse package versions published less than 3 days ago.
minimumReleaseAge: 4320

# Fail installation on a Node version other than the one in package.json engines.
engineStrict: true

# Dependency install scripts are blocked by default. These are deliberately not run:
# re2 is an optional native regex speed-up for firebase-tools; the @firebase/util and
# protobufjs postinstall scripts are not needed by this app.
ignoredBuiltDependencies:
  - '@firebase/util'
  - protobufjs
  - re2
