# Weekly dependency updates. The 3-day cooldown matches pnpm's minimumReleaseAge
# (pnpm-workspace.yaml): brand-new releases are not adopted immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node runtime major (.nvmrc, engines); bump them together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
